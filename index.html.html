<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مِرآة القارئ — Reader's Mirror</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@400;500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EFE6CE;
    --paper-edge: #E2D3A8;
    --ink: #2B2118;
    --ink-soft: #5c4c37;
    --gold: #AD8A4E;
    --gold-bright: #D8B764;
    --maroon: #7A3B2E;
    --highlight: #F4D35E;
    --highlight-glow: rgba(244, 211, 94, 0.65);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #1b1611;
    background-image: radial-gradient(circle at 20% 10%, #2a2119 0%, #1b1611 55%);
    color: var(--ink);
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 36px 20px 60px; }
  header { display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:28px; text-align:center; flex-direction:column; }
  .medallion { width:64px; height:64px; flex-shrink:0; animation: spin 40s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .medallion { animation: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-family:'Reem Kufi', sans-serif; color: var(--gold-bright); font-size: clamp(28px,5vw,42px); margin:0; letter-spacing:1px; }
  .eyebrow { font-size:11px; letter-spacing:4px; text-transform:uppercase; color:#a4906a; margin:0; }
  .book {
    background: var(--paper);
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 26px);
    border-radius:6px;
    box-shadow: 0 1px 0 var(--paper-edge) inset, 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.05);
    position:relative; padding: 34px clamp(20px,5vw,56px);
  }
  .book::before { content:""; position:absolute; inset:10px; border:1px solid rgba(173,138,78,0.35); border-radius:3px; pointer-events:none; }
  .corner { position:absolute; width:26px; height:26px; border:2px solid var(--gold); opacity:0.55; }
  .corner.tl { top:14px; right:14px; border-left:none; border-bottom:none; }
  .corner.tr { top:14px; left:14px; border-right:none; border-bottom:none; }
  .corner.bl { bottom:14px; right:14px; border-left:none; border-top:none; }
  .corner.br { bottom:14px; left:14px; border-right:none; border-top:none; }
  .stage-label { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-soft); margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .stage-label .line { flex:1; height:1px; background:var(--gold); opacity:0.4; }
  textarea#input-text {
    width:100%; min-height:140px; resize:vertical;
    background: rgba(255,255,255,0.35);
    border:1px solid rgba(173,138,78,0.4); border-radius:4px; padding:16px;
    font-family:'Amiri', serif; font-size:22px; line-height:2; color:var(--ink); direction:rtl;
  }
  textarea#input-text:focus { outline:none; border-color:var(--gold-bright); box-shadow:0 0 0 3px rgba(216,183,100,0.25); }

  .engine-choice { display:flex; gap:16px; margin-top:16px; flex-wrap:wrap; }
  .engine-option {
    flex:1; min-width:220px; border:1.5px solid rgba(173,138,78,0.4); border-radius:8px;
    padding:12px 14px; cursor:pointer; background: rgba(255,255,255,0.3); transition: border-color .15s, background .15s;
  }
  .engine-option.selected { border-color: var(--gold-bright); background: rgba(216,183,100,0.18); }
  .engine-option h3 { margin:0 0 4px; font-size:14px; color:var(--ink); }
  .engine-option p { margin:0; font-size:12px; color:var(--ink-soft); line-height:1.5; }
  .engine-option input { display:none; }

  #reading-panel { display:none; margin-top:6px; }
  #reading-panel.active { display:block; }
  #input-panel.hidden { display:none; }
  .reader-text { font-family:'Amiri', serif; font-size:clamp(24px,3.4vw,32px); line-height:2.3; direction:rtl; text-align:justify; color:var(--ink); }
  .word { padding:2px 3px; border-radius:3px; transition: background .15s, box-shadow .15s, color .15s; cursor:pointer; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  .word.active { background: var(--highlight); box-shadow:0 0 0 3px var(--highlight-glow), 0 2px 8px rgba(173,138,78,0.5); color:#1a1408; }
  .word.read { color: var(--ink-soft); }
  .controls { margin-top:26px; display:flex; flex-wrap:wrap; align-items:center; gap:14px; justify-content:space-between; border-top:1px dashed rgba(173,138,78,0.5); padding-top:20px; }
  .controls.sticky-controls {
    position: sticky; bottom: 12px; z-index: 20;
    background: var(--paper); border-radius: 10px;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.55), 0 0 0 1px rgba(173,138,78,0.35);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); margin-top: 20px; border-top: none;
  }
  .transport { display:flex; gap:10px; align-items:center; }
  button.icon-btn {
    width:46px; height:46px; border-radius:50%; border:1.5px solid var(--gold); background:var(--ink); color:var(--gold-bright);
    cursor:pointer; display:flex; align-items:center; justify-content:center; transition: transform .12s, background .12s;
  }
  button.icon-btn:hover { background:#3a2f21; transform: translateY(-1px); }
  button.icon-btn:disabled { opacity:.35; cursor:not-allowed; transform:none; }
  button.icon-btn svg { width:18px; height:18px; }
  button.icon-btn, .primary-btn, .ghost-btn, .engine-option { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .field { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft); letter-spacing:.5px; }
  .field select, .field input[type=range] { accent-color: var(--gold); }
  .field select { padding:6px 8px; border-radius:4px; border:1px solid rgba(173,138,78,0.5); background:rgba(255,255,255,0.4); max-width:220px; }
  .primary-btn {
    font-weight:500; font-size:14px; padding:12px 22px; border-radius:24px; border:none;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold)); color:#1c1408; cursor:pointer; letter-spacing:.5px;
    box-shadow: 0 8px 20px -8px rgba(173,138,78,0.8);
  }
  .primary-btn:hover { filter: brightness(1.06); }
  .ghost-btn { font-size:13px; color:var(--ink-soft); background:none; border:none; text-decoration:underline; cursor:pointer; padding:0; }
  .notice {
    font-size:13px; color: var(--maroon); background: rgba(122,59,46,0.08); border:1px solid rgba(122,59,46,0.25);
    border-radius:6px; padding:10px 14px; margin-top:14px; display:none;
  }
  .notice.show { display:block; }
  .status-line { font-size:12px; color: var(--ink-soft); margin-top: 8px; }
  footer { text-align:center; color:#a4906a; font-size:12px; margin-top:24px; letter-spacing:.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="medallion" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#AD8A4E" stroke-width="1.5" opacity="0.7"/>
      <circle cx="50" cy="50" r="36" fill="none" stroke="#D8B764" stroke-width="1" opacity="0.6"/>
      <g fill="#D8B764" opacity="0.85">
        <path d="M50 8 L54 20 L50 32 L46 20 Z"/>
        <path d="M50 92 L54 80 L50 68 L46 80 Z"/>
        <path d="M8 50 L20 46 L32 50 L20 54 Z"/>
        <path d="M92 50 L80 46 L68 50 L80 54 Z"/>
      </g>
      <circle cx="50" cy="50" r="6" fill="#7A3B2E"/>
    </svg>
    <div>
      <p class="eyebrow">Read‑Along · Arabic Text to Speech</p>
      <h1>مِرآة القارئ</h1>
    </div>
  </header>

  <div class="book">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>

    <div id="input-panel">
      <p class="stage-label">الصق نصّك هنا<span class="line"></span>Paste your Arabic text</p>
      <textarea id="input-text" dir="rtl" placeholder="الصق هنا النص العربي الذي تريد الاستماع إليه…">في قديم الزمان، كان القارئ يفتح كتابه عند غروب الشمس، فتضيء الكلمات كما تضيء المصابيح في الليل. كل حرفٍ كان بابًا، وكل سطرٍ كان طريقًا نحو معرفةٍ جديدة. ومن يقرأ بصوتٍ عالٍ، يسمع الحكمة قبل أن يفهمها، ثم يفهمها بعد أن يسمعها.</textarea>

      <div class="engine-choice">
        <label class="engine-option selected" id="opt-cloud">
          <input type="radio" name="engine" value="cloud" checked>
          <h3>☁️ صوت سحابي · Cloud voice</h3>
          <p>يعمل فورًا على أي جهاز، لا حاجة لتثبيت شيء. الجودة جيدة لكن يتطلب اتصالاً بالإنترنت.<br>Works instantly on any device, nothing to install. Needs an internet connection.</p>
        </label>
        <label class="engine-option" id="opt-device">
          <input type="radio" name="engine" value="device">
          <h3>📱 صوت الجهاز · Device voice</h3>
          <p>يستخدم صوت متصفحك المثبت. أفضل جودة لكن يتطلب تثبيت صوت عربي مسبقًا.<br>Uses your browser's installed voice. Best quality, but needs an Arabic voice pack installed first.</p>
        </label>
      </div>

      <div class="notice" id="voice-notice"></div>

      <div style="margin-top:18px; display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
        <button class="primary-btn" id="start-btn">ابدأ القراءة · Start reading</button>
      </div>
    </div>

    <div id="reading-panel">
      <p class="stage-label">القراءة الآن<span class="line"></span>Now reading</p>
      <div class="reader-text" id="reader-text"></div>
      <p class="status-line" id="status-line"></p>

      <div class="controls sticky-controls">
        <div class="transport">
          <button class="icon-btn" id="play-pause-btn" title="Play/Pause">
            <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <button class="icon-btn" id="stop-btn" title="Stop">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
          </button>
        </div>

        <div class="field" id="voice-field">
          <label for="voice-select">الصوت · Voice</label>
          <select id="voice-select"></select>
        </div>

        <div class="field">
          <label for="rate-range">السرعة · Speed (<span id="rate-val">1.0</span>×)</label>
          <input type="range" id="rate-range" min="0.5" max="1.5" step="0.1" value="1">
        </div>

        <button class="ghost-btn" id="edit-btn">تعديل النص · Edit text</button>
      </div>
    </div>
  </div>

  <footer>الصوت السحابي يرسل النص إلى خدمة غوغل للنطق · Cloud voice sends your text to Google's public speech service to be read aloud</footer>
</div>

<script>
(function () {
  const inputPanel = document.getElementById('input-panel');
  const readingPanel = document.getElementById('reading-panel');
  const inputText = document.getElementById('input-text');
  const startBtn = document.getElementById('start-btn');
  const editBtn = document.getElementById('edit-btn');
  const readerText = document.getElementById('reader-text');
  const playPauseBtn = document.getElementById('play-pause-btn');
  const playIcon = document.getElementById('play-icon');
  const pauseIcon = document.getElementById('pause-icon');
  const stopBtn = document.getElementById('stop-btn');
  const voiceSelect = document.getElementById('voice-select');
  const voiceField = document.getElementById('voice-field');
  const rateRange = document.getElementById('rate-range');
  const rateVal = document.getElementById('rate-val');
  const voiceNotice = document.getElementById('voice-notice');
  const statusLine = document.getElementById('status-line');
  const optCloud = document.getElementById('opt-cloud');
  const optDevice = document.getElementById('opt-device');

  let engine = 'cloud';
  let words = [];       // {text, start, end}
  let wordSpans = [];
  let isPaused = false;

  // ---------- manual-scroll detection ----------
  // If the person scrolls the page themselves, don't auto-scroll them back for a
  // while — otherwise the word-following auto-scroll fights their scroll attempts
  // and they can get stuck unable to reach the controls.
  let lastManualScrollAt = 0;
  let autoScrolling = false;
  window.addEventListener('wheel', () => { if (!autoScrolling) lastManualScrollAt = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { if (!autoScrolling) lastManualScrollAt = Date.now(); }, { passive: true });
  const MANUAL_SCROLL_GRACE_MS = 6000;

  // ---------- engine selection UI ----------
  [optCloud, optDevice].forEach(opt => {
    opt.addEventListener('click', () => {
      [optCloud, optDevice].forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      // Stop whatever the previous engine was doing and clear its paused state,
      // so switching engines never leaves a stale isPaused flag that makes the
      // other engine try to "resume" audio it never actually started.
      player.stop();
      isPaused = false;
      engine = opt.querySelector('input').value;
      voiceField.style.display = engine === 'device' ? 'flex' : 'none';
      voiceNotice.classList.remove('show');
      if (engine === 'device') loadDeviceVoices();
    });
  });
  voiceField.style.display = 'none'; // cloud is default

  // ---------- shared helpers ----------
  function tokenize(text) {
    const result = [];
    const re = /\S+/g;
    let m;
    while ((m = re.exec(text)) !== null) result.push({ text: m[0], start: m.index, end: m.index + m[0].length });
    return result;
  }
  function renderWords() {
    readerText.innerHTML = '';
    wordSpans = words.map((w, i) => {
      const span = document.createElement('span');
      span.className = 'word';
      span.textContent = w.text;
      span.dataset.index = i;
      span.addEventListener('click', () => player.playFrom(i));
      readerText.appendChild(span);
      readerText.appendChild(document.createTextNode(' '));
      return span;
    });
  }
  function clearHighlights() { wordSpans.forEach(s => s.classList.remove('active', 'read')); lastHighlightedIdx = -1; }
  let lastHighlightedIdx = -1;
  function highlightWord(index) {
    if (index === lastHighlightedIdx) return; // avoid re-scrolling every animation frame when the word hasn't changed
    lastHighlightedIdx = index;
    wordSpans.forEach((s, i) => {
      s.classList.toggle('active', i === index);
      s.classList.toggle('read', i < index);
    });
    const el = wordSpans[index];
    if (el) {
      const recentlyManual = (Date.now() - lastManualScrollAt) < MANUAL_SCROLL_GRACE_MS;
      if (!recentlyManual) {
        const r = el.getBoundingClientRect();
        const outOfView = r.top < 80 || r.bottom > (window.innerHeight - 80);
        if (outOfView) {
          autoScrolling = true;
          el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          setTimeout(() => { autoScrolling = false; }, 500);
        }
      }
    }
  }
  function setPlayingUI(playing) {
    playIcon.style.display = playing ? 'none' : 'block';
    pauseIcon.style.display = playing ? 'block' : 'none';
  }

  // ---------- DEVICE engine (Web Speech API) ----------
  const synth = window.speechSynthesis;
  let deviceVoicesPool = [];

  function loadDeviceVoices() {
    if (!synth) return;
    const all = synth.getVoices();
    const arabicVoices = all.filter(v => v.lang && v.lang.toLowerCase().startsWith('ar'));
    const list = arabicVoices.length ? arabicVoices : all;
    voiceSelect.innerHTML = '';
    list.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${v.name} (${v.lang})`;
      voiceSelect.appendChild(opt);
    });
    deviceVoicesPool = list;
    voiceNotice.textContent = 'لم يتم العثور على صوت عربي في متصفحك. جرّب "الصوت السحابي" بدلاً من ذلك. / No Arabic voice found — try the Cloud voice option instead.';
    voiceNotice.classList.toggle('show', arabicVoices.length === 0 && all.length > 0);
  }
  if (synth) { loadDeviceVoices(); synth.onvoiceschanged = loadDeviceVoices; }

  const devicePlayer = {
    playFrom(index) {
      if (!synth) return;
      synth.cancel();
      const sliceText = words.slice(index).map(w => w.text).join(' ');
      const localWords = tokenize(sliceText);
      const u = new SpeechSynthesisUtterance(sliceText);
      const chosen = deviceVoicesPool[voiceSelect.value];
      if (chosen) { u.voice = chosen; u.lang = chosen.lang; } else { u.lang = 'ar-SA'; }
      u.rate = parseFloat(rateRange.value);
      u.onboundary = (e) => {
        if (e.charIndex === undefined) return;
        let localIdx = 0;
        for (let i = 0; i < localWords.length; i++) { if (e.charIndex <= localWords[i].end) { localIdx = i; break; } localIdx = i; }
        highlightWord(index + localIdx);
      };
      u.onend = () => { clearHighlights(); setPlayingUI(false); isPaused = false; };
      u.onerror = () => setPlayingUI(false);
      synth.speak(u);
      setPlayingUI(true);
      isPaused = false;
    },
    pause() { if (synth.speaking) { synth.pause(); isPaused = true; setPlayingUI(false); } },
    resume() { if (isPaused) { synth.resume(); isPaused = false; setPlayingUI(true); } },
    stop() { synth.cancel(); clearHighlights(); setPlayingUI(false); isPaused = false; },
    isBusy() { return synth.speaking || isPaused; }
  };

  // ---------- CLOUD engine (chunked audio playback) ----------
  function splitIntoChunks(wordList, maxChars, firstMaxChars) {
    // firstMaxChars (optional): make the very first chunk shorter than the rest,
    // so the char-per-second calibration gets a real data point quickly instead
    // of running on the initial guess for a long first chunk.
    const chunks = [];
    let cur = [];
    let curLen = 0;
    wordList.forEach((w, i) => {
      const limit = chunks.length === 0 ? (firstMaxChars || maxChars) : maxChars;
      const addLen = w.text.length + 1;
      if (curLen + addLen > limit && cur.length) {
        chunks.push(cur);
        cur = [];
        curLen = 0;
      }
      cur.push(i);
      curLen += addLen;
    });
    if (cur.length) chunks.push(cur);
    return chunks; // array of arrays of global word indices
  }

  let cloudChunks = [];
  let cloudChunkIdx = 0;
  // Reuse one Audio element across chunks instead of creating a new one each time —
  // iOS Safari can silently refuse playback on a freshly-created Audio element that
  // wasn't the one directly started by a user tap, even mid-session. One persistent
  // element sidesteps that.
  let cloudAudio = new Audio();
  cloudAudio.setAttribute('playsinline', '');
  let cloudRAF = null;
  let cloudStartWordIdx = 0;
  let calibratedCharsPerSecond = 12; // self-adjusts after each chunk actually finishes (conservative start so highlight doesn't outrun the voice)

  function cloudUrlFor(text) {
    return 'https://translate.google.com/translate_tts?ie=UTF-8&tl=ar&client=tw-ob&q=' + encodeURIComponent(text);
  }

  function stopCloudRAF() { if (cloudRAF) { cancelAnimationFrame(cloudRAF); cloudRAF = null; } }

  function trackCloudProgress(chunkWordIdxs) {
    stopCloudRAF();
    // Weight each word's time-slice by its character length (plus a space),
    // since a 2-letter word and a 10-letter word don't take equal time to speak.
    // Words ending in punctuation get extra weight, since the voice pauses there.
    const lens = chunkWordIdxs.map(gi => {
      const t = words[gi].text;
      const pause = /[،,.؟!:؛]$/.test(t) ? 5 : 0;
      return t.length + 1 + pause;
    });
    const totalLen = lens.reduce((a, b) => a + b, 0);
    const cumulative = [];
    let running = 0;
    lens.forEach(l => { running += l; cumulative.push(running); });

    // Google's TTS stream often reports a broken/Infinite `duration`, so we can't
    // use currentTime/duration directly. Instead estimate speaking time from the
    // text length, using a per-second rate that's recalibrated after every chunk
    // finishes (see playCloudChunk's 'ended' handler) so it tightens up as it plays.
    function tick() {
      if (!cloudAudio || cloudAudio.paused) { cloudRAF = requestAnimationFrame(tick); return; }
      const estimatedDuration = totalLen / calibratedCharsPerSecond;
      const proportion = Math.min(cloudAudio.currentTime / estimatedDuration, 0.999);
      const targetChar = proportion * totalLen;
      let localIdx = cumulative.findIndex(c => c > targetChar);
      if (localIdx === -1) localIdx = chunkWordIdxs.length - 1;
      highlightWord(chunkWordIdxs[localIdx]);
      cloudRAF = requestAnimationFrame(tick);
    }
    cloudRAF = requestAnimationFrame(tick);
  }

  function playCloudChunk(i) {
    if (i >= cloudChunks.length) { clearHighlights(); setPlayingUI(false); stopCloudRAF(); isPaused = false; return; }
    cloudChunkIdx = i;
    const idxs = cloudChunks[i];
    const text = idxs.map(gi => words[gi].text).join(' ');
    const chunkTotalLen = idxs.reduce((sum, gi) => {
      const t = words[gi].text;
      const pause = /[،,.؟!:؛]$/.test(t) ? 5 : 0;
      return sum + t.length + 1 + pause;
    }, 0);
    statusLine.textContent = '';

    // Fresh one-shot handlers per chunk (old element, new listeners each time).
    const onPlay = () => trackCloudProgress(idxs);
    const onEnded = () => {
      cloudAudio.removeEventListener('play', onPlay);
      cloudAudio.removeEventListener('ended', onEnded);
      cloudAudio.removeEventListener('error', onError);
      stopCloudRAF();
      // Calibrate: how many characters-per-second did this chunk actually speak at?
      // currentTime at 'ended' reflects the real media length (unaffected by playbackRate),
      // so this gives a true reading of pace, smoothed against the running estimate.
      if (cloudAudio.currentTime > 0.3) {
        const measuredRate = chunkTotalLen / cloudAudio.currentTime;
        const bounded = Math.max(6, Math.min(30, measuredRate));
        calibratedCharsPerSecond = calibratedCharsPerSecond * 0.25 + bounded * 0.75;
      }
      playCloudChunk(i + 1);
    };
    const onError = () => {
      cloudAudio.removeEventListener('play', onPlay);
      cloudAudio.removeEventListener('ended', onEnded);
      cloudAudio.removeEventListener('error', onError);
      stopCloudRAF();
      setPlayingUI(false);
      voiceNotice.textContent = 'تعذّر الوصول إلى الصوت السحابي حاليًا. جرّب "صوت الجهاز" بدلاً من ذلك. / The cloud voice is unreachable right now (network or rate limit). Try Device voice instead.';
      voiceNotice.classList.add('show');
    };
    cloudAudio.addEventListener('play', onPlay);
    cloudAudio.addEventListener('ended', onEnded);
    cloudAudio.addEventListener('error', onError);

    cloudAudio.pause();
    cloudAudio.src = cloudUrlFor(text);
    cloudAudio.playbackRate = parseFloat(rateRange.value);
    cloudAudio.load();
    cloudAudio.play().then(() => setPlayingUI(true)).catch(() => {
      setPlayingUI(false);
      voiceNotice.textContent = 'تعذّر تشغيل الصوت. اضغط زر التشغيل مرة أخرى. / Playback was blocked — press play again.';
      voiceNotice.classList.add('show');
    });
  }

  const cloudPlayer = {
    playFrom(index) {
      cloudStartWordIdx = index;
      cloudChunks = splitIntoChunks(words, 110, 40).map(idxs => idxs.filter(gi => gi >= index));
      cloudChunks = cloudChunks.filter(c => c.length);
      cloudAudio.pause();
      playCloudChunk(0);
      isPaused = false;
    },
    pause() { if (!cloudAudio.paused) { cloudAudio.pause(); isPaused = true; setPlayingUI(false); stopCloudRAF(); } },
    resume() {
      if (!isPaused) return;
      if (!cloudAudio.src) { playCloudChunk(cloudChunkIdx || 0); isPaused = false; return; }
      cloudAudio.play().then(() => {
        isPaused = false;
        setPlayingUI(true);
        trackCloudProgress(cloudChunks[cloudChunkIdx]);
      }).catch(() => {
        setPlayingUI(false);
        voiceNotice.textContent = 'تعذّر استئناف الصوت. اضغط زر التشغيل مرة أخرى. / Could not resume playback — press play again.';
        voiceNotice.classList.add('show');
      });
    },
    stop() { cloudAudio.pause(); cloudAudio.currentTime = 0; stopCloudRAF(); clearHighlights(); setPlayingUI(false); isPaused = false; },
    isBusy() { return !cloudAudio.paused || isPaused; }
  };

  const player = {
    playFrom(i) { (engine === 'cloud' ? cloudPlayer : devicePlayer).playFrom(i); },
    pause() { (engine === 'cloud' ? cloudPlayer : devicePlayer).pause(); },
    resume() { (engine === 'cloud' ? cloudPlayer : devicePlayer).resume(); },
    stop() { (engine === 'cloud' ? cloudPlayer : devicePlayer).stop(); },
    isBusy() { return (engine === 'cloud' ? cloudPlayer : devicePlayer).isBusy(); }
  };

  // ---------- wiring ----------
  startBtn.addEventListener('click', () => {
    const currentText = inputText.value.trim();
    if (!currentText) return;
    words = tokenize(currentText);
    renderWords();
    inputPanel.classList.add('hidden');
    readingPanel.classList.add('active');
    player.playFrom(0);
  });

  editBtn.addEventListener('click', () => {
    player.stop();
    readingPanel.classList.remove('active');
    inputPanel.classList.remove('hidden');
  });

  playPauseBtn.addEventListener('click', () => {
    if (!player.isBusy()) { player.playFrom(0); return; }
    if (isPaused) player.resume(); else player.pause();
  });

  stopBtn.addEventListener('click', () => player.stop());

  rateRange.addEventListener('input', () => {
    rateVal.textContent = parseFloat(rateRange.value).toFixed(1);
  });
  rateRange.addEventListener('change', () => {
    // Changing playbackRate on audio that's already mid-stream glitches on iOS Safari,
    // so instead cleanly restart the current chunk from the current word at the new speed.
    if (engine === 'cloud' && cloudPlayer.isBusy()) {
      const activeIdx = wordSpans.findIndex(s => s.classList.contains('active'));
      cloudPlayer.playFrom(Math.max(activeIdx, 0));
    } else if (engine === 'device' && devicePlayer.isBusy()) {
      const activeIdx = wordSpans.findIndex(s => s.classList.contains('active'));
      devicePlayer.playFrom(Math.max(activeIdx, 0));
    }
  });

  voiceSelect.addEventListener('change', () => {
    if (engine === 'device' && devicePlayer.isBusy()) {
      const activeIdx = wordSpans.findIndex(s => s.classList.contains('active'));
      devicePlayer.playFrom(Math.max(activeIdx, 0));
    }
  });
})();
</script>
</body>
</html>
